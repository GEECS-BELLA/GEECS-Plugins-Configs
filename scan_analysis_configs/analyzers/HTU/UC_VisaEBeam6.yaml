schema_version: 2
name: UC_VisaEBeam6
analyzer:
  kind: beam
image:
  type: camera
  description: e beam profile on visa 6 screen
  metadata:
    spatial_calibration: 7.5e-06
  bit_depth: 16
  roi:
    x_min: 195
    x_max: 528
    y_min: 85
    y_max: 418
  background:
    method: from_file
    file_path: '{scan_dir}/computed_background.npy'
    constant_level: 50.0
    additional_constant: 2.0
  crosshair_masking:
    crosshairs:
    - center:
      - 295
      - 85
      width: 108
      height: 108
      thickness: 10
      angle: 0.0
    - center:
      - 290
      - 425
      width: 108
      height: 108
      thickness: 10
      angle: 0.0
  pipeline:
  - background
  - crosshair_masking
  - roi
scan:
  priority: 1
  mode: per_shot
  save: true
  gdoc_slot: 0
