schema_version: 2
name: UC_VisaEBeam8
analyzer:
  kind: beam
image:
  type: camera
  description: e beam profile on visa 8 screen
  metadata:
    spatial_calibration: 7.5e-06
  bit_depth: 16
  roi:
    x_min: 105
    x_max: 438
    y_min: 100
    y_max: 433
  background:
    method: from_file
    file_path: '{scan_dir}/computed_background.npy'
    constant_level: 50.0
    additional_constant: 2.0
  pipeline:
  - background
  - roi
scan:
  priority: 1
  mode: per_shot
  save: true
  gdoc_slot: 0
