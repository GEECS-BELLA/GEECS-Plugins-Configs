schema_version: 3
device: UC_VisaEBeam8
description: e beam profile on visa 8 screen
metadata:
  spatial_calibration: 7.5e-06
input:
  kind: camera
inputs:
  camera_background:
    path: '{scan_dir}/computed_background.npy'
    fallback_level: 50.0
steps:
- step: background_frame
  source: camera_background
  alignment: samples
- step: background_constant
  level: 2
- step: roi
  bounds:
  - - 100
    - 433
  - - 105
    - 438
measure:
  kind: beam
scan:
  priority: 1
figure:
  imshow:
    vmin: 0
  fig:
    dpi: 150
summaries:
- kind: image_grid
  panel_size:
  - 6.0
  - 6.0
- kind: average
