schema_version: 3
device: Dutch1Mmt
description: Example configuration for processing 1D spectral data or lineouts
input:
  kind: line
  file_tail: .txt
  loading:
    data_type: tsv
  x_unit: MeV
  label: Charge density vs Energy
steps:
- step: background_constant
  level: 0
- step: roi
  bounds:
  - - 60
    - 500
  units: axis
- step: median
- step: clip_below
  level: -10
measure:
  kind: line
scan:
  priority: 1
figure:
  fig:
    dpi: 150
summaries:
- kind: waterfall
- kind: average
