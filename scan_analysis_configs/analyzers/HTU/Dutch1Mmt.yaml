schema_version: 2
name: Dutch1Mmt
analyzer:
  kind: line
image:
  type: line
  description: Example configuration for processing 1D spectral data or lineouts
  data_loading:
    data_type: tsv
  label: Charge density vs Energy
  x_units: MeV
  x_scale_factor: 1.0
  processing_dtype: float64
  storage_dtype: float32
  roi:
    x_min: 60.0
    x_max: 500.0
  background:
    method: constant
    constant_level: 0.0
  filtering:
    method: median
    kernel_size: 3
    sigma: 2.0
  thresholding:
    method: absolute
    threshold_value: -10.0
    clip_below: true
  pipeline:
  - background
  - roi
  - filtering
  - thresholding
scan:
  priority: 1
  mode: per_shot
  save: true
  gdoc_slot: 0
  file_tail: .txt
