schema_version: 3
device: pulsewire-picoscope
output_name: pulsewire-picoscope-field-map-chB
description: >-
  Pulsed-wire field map, channel B (the twin of pulsed_wire_field_map on channel A): the time derivative of the
  lowpassed channel-B deflection (proportional to the local field) per hexapod
  position, on a diverging scale centred on zero.
input:
  kind: line
  file_tail: .tdms
  format: per_shot_files
  loading:
    data_type: tdms_scope
    trace_index: 1
  x_unit: s
  y_unit: V
  label: y deflection
steps:
  - step: lowpass
    order: 2
    critical_frequency: 1.5e-3
  - step: roi
    units: axis
    bounds: [[1.0e-3, 3.84e-3]]
  - step: derivative
measure:
  kind: none
scan:
  average_frames_first: true
figure:
  fig: {dpi: 150}
  axes: {xlabel: "time (s)"}
summaries:
  - kind: waterfall
    scale: diverging
    cmap: RdBu_r
