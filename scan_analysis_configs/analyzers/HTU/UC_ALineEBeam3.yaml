schema_version: 3
device: UC_ALineEBeam3
description: A-Line electron beam camera 3 for beam profiling
metadata:
  location: between A and B cave in the cutout
  notes: starter config adapted from UC_ALineEBeam2; refine ROI + spatial_calibration
    with beam-3 calibration runs
  spatial_calibration: 2.217e-05
input:
  kind: camera
steps:
- step: background_constant
  level: 50
- step: roi
  bounds:
  - - 1
    - 964
  - - 1
    - 1289
- step: zero_below
  level: 0
measure:
  kind: beam
scan:
  priority: 50
figure:
  imshow:
    vmin: 0
  fig:
    dpi: 150
summaries:
- kind: image_grid
  panel_size:
  - 6.0
  - 6.0
- kind: average
