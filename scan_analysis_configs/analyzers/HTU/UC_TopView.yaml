schema_version: 2
name: UC_TopView
analyzer:
  kind: beam
image:
  type: camera
  description: IR mode at the input to amp3
  metadata:
    location: Room 148
    notes: none
    spatial_calibration: 2.44e-05
  roi:
    x_min: 10
    x_max: 750
    y_min: 350
    y_max: 600
  background:
    method: constant
    constant_level: 5.0
  thresholding:
    value: 0.0
    mode: to_zero
  filtering:
    median_kernel_size: 3
  pipeline:
  - background
  - roi
  - filtering
scan:
  priority: 10
