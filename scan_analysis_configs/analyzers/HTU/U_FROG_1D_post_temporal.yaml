schema_version: 3
device: U_FROG_Grenouille
output_name: U_FROG_Grenouille-Temporal
description: BCave ICT charge measurement from oscilloscope traces
input:
  kind: line
  folder: U_FROG_Grenouille-Temporal
  file_tail: _retrieved_lineouts.tsv
  loading:
    data_type: tsv
  label: x vs y
steps:
- step: background_constant
  level: 0
- step: interpolate
  count: 300
  lower: -175
  upper: 175
- step: roi
  bounds:
  - - -200
    - 200
  units: axis
- step: median
  kernel: 1
- step: clip_below
  level: -10
measure:
  kind: line
scan:
  priority: 2
figure:
  fig:
    dpi: 150
summaries:
- kind: waterfall
- kind: average
