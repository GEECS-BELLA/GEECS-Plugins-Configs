schema_version: 2
name: U_FROG_Grenouille-Temporal
analyzer:
  kind: line
image:
  type: line
  description: BCave ICT charge measurement from oscilloscope traces
  data_loading:
    data_type: tsv
  processing_dtype: float64
  storage_dtype: float32
  roi:
    x_min: -200.0
    x_max: 200.0
  interpolation:
    num_points: 300
    x_min: -175.0
    x_max: 175.0
  background:
    method: constant
    constant_level: 0.0
  filtering:
    method: median
    kernel_size: 1
    sigma: 2.0
  thresholding:
    method: absolute
    threshold_value: -10.0
    clip_below: true
  pipeline:
  - background
  - interpolation
  - roi
  - filtering
  - thresholding
scan:
  priority: 2
  mode: per_shot
  save: true
  file_tail: _retrieved_lineouts.tsv
