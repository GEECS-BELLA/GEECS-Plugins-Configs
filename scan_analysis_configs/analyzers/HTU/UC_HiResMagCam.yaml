schema_version: 3
device: UC_HiResMagCam
description: High resolution magnetic spectrometer camera; bow-tie fit of the dispersed
  electron beam, per shot. bowtie_x0 is the imaged-energy column; its mean over the
  finite values (rejected fits are NaN) is the number to read.
metadata:
  location: Undulator beamline
  spatial_calibration: 2.217e-05
input:
  kind: camera
  format: device_hdf5
steps:
- step: background_constant
  level: 75
- step: clip_below
  level: 0
- step: median
measure:
  kind: hi_res_mag_cam
figure:
  imshow:
    vmin: 0
  fig:
    dpi: 150
summaries:
- kind: image_grid
  panel_size:
  - 6.0
  - 6.0
- kind: average
