schema_version: 2
name: UC_ExpanderIn1
analyzer:
  kind: beam
image:
  type: camera
  description: IR mode at the input to amp2
  metadata:
    location: Room 148
    notes: none
    spatial_calibration: 2.44e-05
  bit_depth: 16
  roi:
    x_min: 125
    x_max: 575
    y_min: 1
    y_max: 450
  background:
    method: constant
    constant_level: 50.0
  thresholding:
    method: constant
    value: 0.0
    mode: to_zero
    invert: false
  pipeline:
  - background
  - roi
  - thresholding
scan:
  priority: 20
  mode: per_shot
  save: true
