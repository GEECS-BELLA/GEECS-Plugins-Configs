schema_version: 3
device: HTT-D-EBeam_Profiler
description: high resolution for electron beam profile analysis
metadata:
  spatial_calibration: 1.9e-05
  location: HTT target chamber
  notes: NA
input:
  kind: camera
inputs:
  camera_background:
    path: '{scan_dir}/computed_background.npy'
    fallback_level: 100.0
steps:
- step: background_frame
  source: camera_background
  alignment: samples
- step: background_constant
  level: 20
- step: zero_below
  level: 0
- step: median
  kernel: 5
measure:
  kind: beam
scan:
  priority: 1
figure:
  imshow:
    vmin: 0
  fig:
    dpi: 150
summaries:
- kind: image_grid
  panel_size:
  - 6.0
  - 6.0
- kind: average
