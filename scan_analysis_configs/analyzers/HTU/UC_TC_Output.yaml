schema_version: 2
name: UC_TC_Output
analyzer:
  kind: beam
image:
  type: camera
  description: image of target chamber output port
  metadata:
    location: B-cave
    notes: none
    spatial_calibration: 2.44e-05
  bit_depth: 16
  roi:
    x_min: 200
    x_max: 350
    y_min: 100
    y_max: 250
  background:
    method: constant
    constant_level: 0.0
    additional_constant: 0.0
  thresholding:
    method: constant
    value: 0.0
    mode: to_zero
    invert: false
  pipeline:
  - background
  - roi
  - thresholding
scan:
  priority: 10
  mode: per_shot
  save: true
