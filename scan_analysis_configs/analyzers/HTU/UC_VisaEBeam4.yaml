schema_version: 2
name: UC_VisaEBeam4
analyzer:
  kind: beam
image:
  type: camera
  description: e beam profile on visa 4 screen
  metadata:
    spatial_calibration: 7.5e-06
  bit_depth: 16
  roi:
    x_min: 180
    x_max: 513
    y_min: 200
    y_max: 533
  background:
    method: from_file
    file_path: '{scan_dir}/computed_background.npy'
    constant_level: 50.0
    additional_constant: 2.0
  crosshair_masking:
    crosshairs:
    - center:
      - 268
      - 175
      width: 108
      height: 108
      thickness: 10
      angle: 2.5
    - center:
      - 287
      - 533
      width: 108
      height: 108
      thickness: 10
      angle: 2.5
  transforms:
    rotation_angle: 2.5
    flip_horizontal: false
    flip_vertical: false
  pipeline:
  - background
  - crosshair_masking
  - roi
  - transforms
scan:
  priority: 1
  mode: per_shot
  save: true
  gdoc_slot: 0
