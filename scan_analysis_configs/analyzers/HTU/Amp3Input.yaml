schema_version: 2
name: UC_Amp3_IR_Input
analyzer:
  kind: beam
image:
  type: camera
  description: IR mode at the input to amp3
  metadata:
    location: Room 148
    notes: none
    spatial_calibration: 2.44e-05
  bit_depth: 16
  roi:
    x_min: 50
    x_max: 700
    y_min: 100
    y_max: 700
  background:
    method: constant
    constant_level: 90.0
  thresholding:
    method: constant
    value: 0.0
    mode: to_zero
    invert: false
  pipeline:
  - background
  - roi
  - thresholding
scan:
  priority: 35
  mode: per_shot
  save: false
