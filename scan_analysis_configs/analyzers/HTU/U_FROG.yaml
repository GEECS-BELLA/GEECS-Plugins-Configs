schema_version: 2
name: U_FROG_Grenouille
output_name: U_FROG_Grenouille-Temporal
analyzer:
  kind: frog_retrieval
  delt: 0.85
  dellam: -0.085
  lam0: 400.0
  N: 512
  target_error: 0.0001
  max_time_seconds: 15.0
  max_iterations: 1000000000
image:
  type: camera
  description: image of target chamber output port
  metadata:
    location: '148'
    notes: none
    spatial_calibration: 2.44e-05
  bit_depth: 16
  background:
    method: constant
    constant_level: 0.0
  thresholding:
    method: constant
    value: 0.0
    mode: to_zero
    invert: false
  pipeline:
  - background
  - thresholding
scan:
  priority: 1
  mode: per_shot
  save: false
  device: U_FROG_Grenouille-Temporal
