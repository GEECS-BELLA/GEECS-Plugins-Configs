schema_version: 2
name: UC_ModeImager
analyzer:
  kind: beam
image:
  type: camera
  description: imager of main laser driver
  metadata:
    location: B-cave
    notes: none
    spatial_calibration: 2.44e-05
  bit_depth: 16
  background:
    method: constant
    constant_level: 100.0
  thresholding:
    method: constant
    value: 0.0
    mode: to_zero
    invert: false
  filtering:
    median_kernel_size: 3
  pipeline:
  - background
  - thresholding
  - filtering
scan:
  priority: 20
  mode: per_shot
  save: true
