schema_version: 2
name: UC_ModeImager
analyzer:
  kind: beam
image:
  type: camera
  description: imager of main laser driver
  metadata:
    location: B-cave
    notes: none
    spatial_calibration: 2.44e-05
  roi:
    x_min: 500
    x_max: 900
    y_min: 400
    y_max: 800
  background:
    method: constant
    constant_level: 30.0
  thresholding:
    value: 0.0
    mode: to_zero
  filtering:
    median_kernel_size: 3
  pipeline:
  - background
  - thresholding
  - filtering
  - roi
  - roi
  - roi
  - roi
  - roi
scan:
  priority: 20
