schema_version: 3
device: U_BCaveMagSpec
output_name: U_BCaveMagSpec-interpSpec
description: Example configuration for processing 1D spectral data or lineouts
input:
  kind: line
  folder: U_BCaveMagSpec-interpSpec
  file_tail: .txt
  format: device_hdf5
  loading:
    data_type: pva_stack
  x_unit: MeV
  label: Charge density vs Energy
steps:
- step: roi
  bounds:
  - - 10
    - 150
- step: background_constant
  level: 0
- step: median
- step: clip_below
  level: -10
measure:
  kind: line
scan:
  priority: 1
figure:
  axes:
    xlabel: Energy (MeV)
    ylabel: Spectral Density (pC/MeV...sort of)
  fig:
    dpi: 150
summaries:
- kind: waterfall
- kind: average
