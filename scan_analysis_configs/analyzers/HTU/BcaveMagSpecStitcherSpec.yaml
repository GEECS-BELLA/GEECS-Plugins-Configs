schema_version: 3
device: U_BCaveMagSpec
output_name: U_BCaveMagSpec-interpSpec
description: Example configuration for processing 1D spectral data or lineouts
input:
  kind: line
  folder: U_BCaveMagSpec-interpSpec
  file_tail: .txt
  format: device_hdf5
  loading:
    data_type: pva_stack
  x_scale: 1000.0
  x_unit: MeV
  label: Charge density vs Energy
steps:
- step: background_constant
  level: 0
- step: roi
  bounds:
  - - 60
    - 160
  units: axis
- step: median
- step: clip_below
  level: -10
measure:
  kind: line
scan:
  priority: 1
figure:
  fig:
    dpi: 150
summaries:
- kind: waterfall
- kind: average
