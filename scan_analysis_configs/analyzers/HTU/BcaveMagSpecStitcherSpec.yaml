schema_version: 2
name: U_BCaveMagSpec
output_name: U_BCaveMagSpec-interpSpec
analyzer:
  kind: line
image:
  type: line
  description: Example configuration for processing 1D spectral data or lineouts
  data_loading:
    data_type: pva_stack
  label: Charge density vs Energy
  x_units: MeV
  x_scale_factor: 1000.0
  roi:
    x_min: 60.0
    x_max: 160.0
  background:
    method: constant
    constant_level: 0.0
  filtering:
    method: median
    kernel_size: 3
    sigma: 2.0
  thresholding:
    method: absolute
    threshold_value: -10.0
  pipeline:
  - background
  - roi
  - filtering
  - thresholding
scan:
  priority: 1
  gdoc_slot: 0
  device: U_BCaveMagSpec-interpSpec
  file_tail: .txt
  data_format: device_hdf5
