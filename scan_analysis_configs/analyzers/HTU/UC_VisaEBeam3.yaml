schema_version: 2
name: UC_VisaEBeam3
analyzer:
  kind: beam
image:
  type: camera
  description: e beam profile on visa 3 screen
  metadata:
    spatial_calibration: 7.5e-06
  bit_depth: 16
  roi:
    x_min: 160
    x_max: 493
    y_min: 140
    y_max: 473
  background:
    method: from_file
    file_path: '{scan_dir}/computed_background.npy'
    constant_level: 50.0
    additional_constant: 2.0
  crosshair_masking:
    crosshairs:
    - center:
      - 374
      - 127
      width: 108
      height: 108
      thickness: 10
      angle: -3.5
    - center:
      - 338
      - 485
      width: 108
      height: 108
      thickness: 10
      angle: -3.5
  transforms:
    rotation_angle: -3.5
    flip_horizontal: false
    flip_vertical: false
  pipeline:
  - background
  - crosshair_masking
  - roi
  - transforms
scan:
  priority: 1
  mode: per_shot
  save: true
  gdoc_slot: 0
