schema_version: 3
device: pulsewire-picoscope
input:
  kind: line
  file_tail: .tdms
  format: per_shot_files
  loading:
    data_type: tdms_scope
    trace_index: 1
    y_column: 0
steps:
- step: background_constant
  level: -0.075
measure:
  kind: line
scan:
  average_frames_first: true
summaries:
- kind: waterfall
- kind: average
