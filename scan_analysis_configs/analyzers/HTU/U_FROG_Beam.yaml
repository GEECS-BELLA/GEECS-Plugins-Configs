schema_version: 2
name: U_FROG_Grenouille
output_name: U_FROG_Grenouille
analyzer:
  kind: beam
image:
  type: camera
  description: image of target chamber output port
  metadata:
    location: '148'
    notes: none
    spatial_calibration: 2.44e-05
  background:
    method: constant
  thresholding:
    value: 0.0
    mode: to_zero
  filtering:
    median_kernel_size: 3
  pipeline:
  - background
  - thresholding
  - filtering
scan:
  priority: 2
  device: U_FROG_Grenouille
  data_format: device_hdf5
  renderer:
    colormap_mode: auto
    cmap: viridis
    vmin: -100.0
    vmax: 100.0
    xlabel: thing
    ylabel: asdf
    colorbar_label: test
    figsize:
    - 10.0
    - 1.0
