schema_version: 2
name: UC_OAPin2
analyzer:
  kind: beam
image:
  type: camera
  description: High power mode imager
  metadata:
    spatial_calibration: 2.44e-05
    location: A-Line beamline
    notes: Migrated from hardcoded configuration in EBeamProfile.py
  bit_depth: 16
  roi:
    x_min: 200
    x_max: 1260
    y_min: 1
    y_max: 950
  background:
    method: constant
    constant_level: 150.0
  thresholding:
    method: constant
    value: 0.0
    mode: to_zero
    invert: false
  filtering:
    median_kernel_size: 3
  pipeline:
  - background
  - roi
  - thresholding
  - filtering
scan:
  priority: 18
  mode: per_shot
  save: true
