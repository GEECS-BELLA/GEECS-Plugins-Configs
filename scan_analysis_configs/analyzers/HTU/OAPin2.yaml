schema_version: 3
device: UC_OAPin2
description: High power mode imager
metadata:
  spatial_calibration: 2.44e-05
  location: A-Line beamline
  notes: Migrated from hardcoded configuration in EBeamProfile.py
input:
  kind: camera
steps:
- step: background_constant
  level: 150
- step: roi
  bounds:
  - - 1
    - 950
  - - 200
    - 1260
- step: zero_below
  level: 0
- step: median
measure:
  kind: beam
scan:
  priority: 18
figure:
  imshow:
    vmin: 0
  fig:
    dpi: 150
summaries:
- kind: image_grid
  panel_size:
  - 6.0
  - 6.0
- kind: average
