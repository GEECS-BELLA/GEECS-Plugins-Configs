schema_version: 3
device: U_BCaveMagSpec
description: B-Cave magnetic spectrometer camera for electron beam profiling
metadata:
  location: B-cave
  notes: NA
  spatial_calibration: 2.217e-05
input:
  kind: camera
steps:
- step: background_constant
  level: 1
- step: roi
  bounds:
  - - 1
    - 180
  - - 50
    - 300
- step: zero_below
  level: 0
measure:
  kind: beam
  compute_slopes: true
scan:
  priority: 3
  average_frames_first: true
figure:
  imshow:
    vmin: 0
  fig:
    dpi: 150
summaries:
- kind: image_grid
  panel_size:
  - 6.0
  - 6.0
- kind: average
