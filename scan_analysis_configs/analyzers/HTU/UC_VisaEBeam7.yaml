schema_version: 2
name: UC_VisaEBeam7
analyzer:
  kind: beam
image:
  type: camera
  description: e beam profile on visa 7 screen
  metadata:
    spatial_calibration: 7.5e-06
  bit_depth: 16
  roi:
    x_min: 120
    x_max: 453
    y_min: 100
    y_max: 433
  background:
    method: from_file
    file_path: '{scan_dir}/computed_background.npy'
    constant_level: 50.0
    additional_constant: 2.0
  crosshair_masking:
    crosshairs:
    - center:
      - 275
      - 328
      width: 108
      height: 108
      thickness: 10
      angle: -8.0
    - center:
      - 275
      - 550
      width: 108
      height: 108
      thickness: 10
      angle: -8.0
  transforms:
    rotation_angle: -8.0
    flip_horizontal: false
    flip_vertical: false
  pipeline:
  - background
  - crosshair_masking
  - roi
  - transforms
scan:
  priority: 1
  mode: per_shot
  save: true
  gdoc_slot: 0
