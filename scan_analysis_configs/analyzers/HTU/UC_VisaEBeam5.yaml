schema_version: 3
device: UC_VisaEBeam5
description: e beam profile on visa 5 screen
metadata:
  spatial_calibration: 7.5e-06
input:
  kind: camera
inputs:
  camera_background:
    path: '{scan_dir}/computed_background.npy'
    fallback_level: 50.0
steps:
- step: background_frame
  source: camera_background
  alignment: samples
- step: background_constant
  level: 2
- step: crosshair_mask
  center:
  - 95
  - 267
  width: 108
  height: 108
  thickness: 10
- step: crosshair_mask
  center:
  - 440
  - 262
  width: 108
  height: 108
  thickness: 10
- step: roi
  bounds:
  - - 90
    - 423
  - - 135
    - 468
measure:
  kind: beam
scan:
  priority: 1
figure:
  imshow:
    vmin: 0
  fig:
    dpi: 150
summaries:
- kind: image_grid
  panel_size:
  - 6.0
  - 6.0
- kind: average
