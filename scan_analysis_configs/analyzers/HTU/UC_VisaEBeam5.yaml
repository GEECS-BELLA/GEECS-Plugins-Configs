schema_version: 2
name: UC_VisaEBeam5
analyzer:
  kind: beam
image:
  type: camera
  description: e beam profile on visa 5 screen
  metadata:
    spatial_calibration: 7.5e-06
  bit_depth: 16
  roi:
    x_min: 135
    x_max: 468
    y_min: 90
    y_max: 423
  background:
    method: from_file
    file_path: '{scan_dir}/computed_background.npy'
    constant_level: 50.0
    additional_constant: 2.0
  crosshair_masking:
    crosshairs:
    - center:
      - 267
      - 95
      width: 108
      height: 108
      thickness: 10
      angle: 0.0
    - center:
      - 262
      - 440
      width: 108
      height: 108
      thickness: 10
      angle: 0.0
  pipeline:
  - background
  - crosshair_masking
  - roi
scan:
  priority: 1
  mode: per_shot
  save: true
  gdoc_slot: 0
