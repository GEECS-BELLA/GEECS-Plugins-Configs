schema_version: 3
device: pulsewire-picoscope
output_name: pulsewire-picoscope-field-map
description: 'Pulsed-wire field map, horizontal plane: the time derivative of the
  lowpassed x deflection (proportional to the local field) per hexapod position, on
  a diverging scale centred on zero.'
input:
  kind: line
  file_tail: .tdms
  format: per_shot_files
  loading:
    data_type: tdms_scope
  x_unit: s
  y_unit: V
  label: x deflection
steps:
- step: lowpass
  critical_frequency: 0.0015
- step: roi
  bounds:
  - - 0.001
    - 0.00384
  units: axis
- step: derivative
measure:
  kind: none
scan:
  average_frames_first: true
figure:
  axes:
    xlabel: time (s)
  fig:
    dpi: 150
summaries:
- kind: waterfall
  scale: diverging
  cmap: RdBu_r
