schema_version: 3
device: HTT-C23_4_MagSpec4
description: High power mode imager
input:
  kind: camera
inputs:
  camera_background:
    from_scan:
      scan: 1
      statistic: mean
  camera_table:
    table: calibrations/HTT/260224DnnVarianCam.txt
  trajectory_table:
    table: calibrations/HTT/170925DnnVarianTrj.txt
  lanex_table:
    table: calibrations/HTT/250101lanexCalib.txt
steps:
- step: background_frame
  source: camera_background
  alignment: samples
- step: background_constant
  level: 1.5
- step: vignette
  full_width: 1384
  full_height: 1032
  y_offset: 420
  vgnt4: 1.2e-12
  vgnt2: -2.0e-06
- step: roi
  bounds:
  - - 20
    - 170
  - - 25
    - 1384
- step: zero_below
  level: 0
- step: median
  kernel: 5
- step: rotate
  angle: 0.1
measure:
  kind: magspec
  calibration:
    kind: dnn_axis
    camera_number: 4
    magnetic_field_t: 0.2008
  camera_table: camera_table
  trajectory_table: trajectory_table
  lanex_table: lanex_table
  energy_range:
  - 1.2
  - 1501.3
  num_energy_points: 1000
  magnetic_field_column: HTT-MagTeslameter-DTM141 Field
scan:
  priority: 1
figure:
  imshow:
    vmin: 0
  fig:
    dpi: 150
summaries:
- kind: image_grid
  panel_size:
  - 6.0
  - 6.0
- kind: average
