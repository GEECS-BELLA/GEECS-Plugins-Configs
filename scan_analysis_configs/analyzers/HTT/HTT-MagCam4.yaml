schema_version: 2
name: HTT-C23_4_MagSpec4
analyzer:
  kind: magspec
  calibration:
    kind: dnn_axis
    camera_calibration_file: data/HTT-MagSpce-Calibrations/260224DnnVarianCam.txt
    trajectory_calibration_file: data/HTT-MagSpce-Calibrations/170925DnnVarianTrj.txt
    camera_number: 4
    magnetic_field_t: 0.2008
    lanex_calibration_file: data/HTT-MagSpce-Calibrations/250101lanexCalib.txt
  energy_range:
  - 1.2
  - 1501.3
  num_energy_points: 1000
image:
  type: camera
  description: High power mode imager
  bit_depth: 16
  roi:
    x_min: 25
    x_max: 1384
    y_min: 20
    y_max: 170
  background:
    additional_constant: 1.5
  vignette:
    method: radial_polynomial
    full_width: 1384
    full_height: 1032
    x_offset: 0
    y_offset: 420
    vgnt4: 1.2e-12
    vgnt2: -2.0e-06
    vgnt0: 1.0
    min_model_value: 1.0e-09
  thresholding:
    method: constant
    value: 0.0
    mode: to_zero
    invert: false
  filtering:
    median_kernel_size: 5
  transforms:
    rotation_angle: 0.1
    flip_horizontal: false
    flip_vertical: false
  pipeline:
  - background
  - vignette
  - roi
  - thresholding
  - filtering
  - transforms
scan:
  priority: 1
  mode: per_shot
  save: true
  background_source:
    scan_number: 1
