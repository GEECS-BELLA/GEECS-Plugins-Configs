schema_version: 2
name: HTT-D-EBeam_Profiler
analyzer:
  kind: beam
image:
  type: camera
  description: ASSERT test bench optimisation camera
  metadata:
    location: L cave
    notes: none
    spatial_calibration: 1
  bit_depth: 16
  background:
    method: constant
    constant_level: 90.0
  thresholding:
    method: constant
    value: 0.0
    mode: to_zero
    invert: false
  pipeline:
  - background
  - thresholding
scan:
  priority: 100
  mode: per_shot
  save: false
