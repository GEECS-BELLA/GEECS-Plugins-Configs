name: UC_ALineEbeam1
image_analyzer: beam
image:
  bit_depth: 16
  description: A-Line electron beam camera 1 for beam profiling
  background:
    enabled: true
    method: constant
    constant_level: 60.0
  crosshair_masking:
    crosshairs: []
    enabled: false
  filtering:
    gaussian_sigma: null
    median_kernel_size: 5
  metadata:
    location: between A and B cave in the cutout
    notes: none
    spatial_calibration: 2.217e-05
  roi:
    x_max: 800
    x_min: 300
    y_max: 900
    y_min: 500
  thresholding:
    enabled: true
    invert: false
    method: constant
    mode: to_zero
    value: 0.0
  transforms:
    flip_horizontal: false
    flip_vertical: false
    rotation_angle: 0.0
scan:
  priority: 1
  mode: per_shot
  save: true
  gdoc_slot: 1
