# TEMPORARY (untracked) — live-test diagnostic for the Bluesky optimization
# bridge, laser-off dark frames. New unified schema; values adapted from the
# legacy UC_Amp2_IR_input.yaml (which predates the DiagnosticConfig schema
# and no longer validates). Delete after the legacy file is migrated.

name: UC_Amp2_IR_input
image_analyzer: image_analysis.analyzers.beam_analyzer.BeamAnalyzer
image:
  type: camera
  bit_depth: 16
  description: IR mode at the input to amp2 (dark-frame bridge test)
  background:
    method: constant
    constant_level: 100.0
  metadata:
    location: Room 148
    notes: bridge live test; adapted from legacy UC_Amp2_IR_input.yaml
    spatial_calibration: 2.44e-05
  roi:
    x_max: 500
    x_min: 1
    y_max: 500
    y_min: 1
  filtering:
    gaussian_sigma: null
    median_kernel_size: 3
  thresholding:
    method: constant
    value: 0.0
    mode: to_zero
    invert: false
  pipeline:
    steps:
    - background
    - roi
    - thresholding
scan:
  priority: 50
  mode: per_bin
  save: true
