schema_version: 2
name: UC_Amp4_IR_input
analyzer:
  kind: beam
image:
  type: camera
  description: Image analyzer to calcuate basic statistics of the IR laser beam profile
    at the input to amp4.
  metadata:
    location: Room 148
    notes: none
    spatial_calibration: 2.44e-05
  bit_depth: 16
  roi:
    x_min: 1
    x_max: 600
    y_min: 1
    y_max: 600
  background:
    method: constant
    constant_level: 90.0
    additional_constant: 0.0
  thresholding:
    method: constant
    value: 0.0
    mode: to_zero
    invert: false
  pipeline:
  - background
  - roi
  - thresholding
scan:
  priority: 10
  mode: per_shot
  save: true
