name: UC_Amp4_IR_input
image_analyzer: image_analysis.analyzers.beam_analyzer.BeamAnalyzer
image:
  type: camera
  description: Image analyzer to calcuate basic statistics of the IR laser beam profile at the input to amp4.
  bit_depth: 16
  roi:
    x_min: 1
    x_max: 600
    y_min: 1
    y_max: 600
  background:
    method: constant
    file_path: null
    constant_level: 90.0
    additional_constant: 0.0
  crosshair_masking: null
  circular_mask: null
  vignette: null
  thresholding:
    method: constant
    value: 0.0
    mode: to_zero
    invert: false
  filtering: null
  normalization: null
  transforms: null
  pipeline:
    steps:
    - background
    - roi
    - thresholding
  analysis: null
  metadata:
    location: Room 148
    notes: none
    spatial_calibration: 2.44e-05
scan:
  priority: 10
  mode: per_shot
  save: true
