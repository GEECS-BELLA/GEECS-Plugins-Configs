schema_version: 3
device: UC_Amp4_IR_input
description: Image analyzer to calcuate basic statistics of the IR laser beam profile
  at the input to amp4.
metadata:
  location: Room 148
  notes: none
  spatial_calibration: 2.44e-05
input:
  kind: camera
  format: device_hdf5
steps:
- step: background_constant
  level: 90
- step: roi
  bounds:
  - - 1
    - 600
  - - 1
    - 600
- step: zero_below
  level: 0
measure:
  kind: beam
scan:
  priority: 10
figure:
  imshow:
    vmin: 0
  fig:
    dpi: 150
summaries:
- kind: image_grid
  panel_size:
  - 6.0
  - 6.0
- kind: average
