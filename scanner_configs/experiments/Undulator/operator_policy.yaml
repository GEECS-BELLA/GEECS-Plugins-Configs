# bounds apply regardless of a grant. Shape (GeecsCanopy/DEPLOYMENT.md 3a):
#   grants:
#     - operators: [A. Operator]
#       devices: [U_148_PLC]          # or families: [<DB device type>]
#       roles: [DO.Ch1]               # empty: every role the device allows
