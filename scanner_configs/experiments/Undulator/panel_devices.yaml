# Per-device panel data for the devices native_devices.yaml lists (GEECS-Schemas
# PanelDevices): each one's family and what differs from it on this device. Read by
# GeecsCanopy's directory and device module, joined to native_devices.yaml by device
# name; the scan worker never reads it. `ioc` is the IOC_NAME in the camera host's
# compose file (geecs-epics services/undulator/cameras/): the module judges freshness
# by that IOC's devIocStats heartbeat.
schema_version: 1
devices:
  ADTEST_CAM1:
    family: ad_camera_chain
    ioc: adtest-cam1
  UC_VisaEBeam6:
    family: ad_camera_chain
    ioc: uc-visaebeam6
