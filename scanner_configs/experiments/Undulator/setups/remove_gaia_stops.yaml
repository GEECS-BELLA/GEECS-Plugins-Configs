schema_version: 1
name: remove_gaia_stops
steps:
- do: set
  device: U_148_PLC
  variable: DO.Ch1
  value: 'off'
- do: wait
  seconds: 0.5
- do: set
  device: U_148_PLC
  variable: DO.Ch2
  value: 'off'
- do: wait
  seconds: 1.0
- do: check
  device: U_148_PLC
  variable: DI.Ch2
  expected: 'on'
- do: wait
  seconds: 0.5
- do: check
  device: U_148_PLC
  variable: DI.Ch4
  expected: 'on'
