schema_version: 1
name: U_VS4V_native_check
description: 'U_VS4V native IOC acceptance: relative sweep -0.5..+0.5 A, 5 points
  x 5 shots, UC_VisaEBeam2, HTU-NoGas (restored on exit)'
trigger_profile: HTU-NoGas
background: false
native_image_save: null
background_telemetry: null
devices:
- device: UC_VisaEBeam2
  save_images: true
  required: true
plan:
  name: sweep
  args: []
  kwargs:
    shots_per_step: 5
    acquisition: strict
    sweep:
      trajectory:
        kind: axes
        combine: zip
        snake: false
        axes:
        - kind: range
          axis: VS4V
          relative: true
          start: -0.5
          stop: 0.5
          num: 5
