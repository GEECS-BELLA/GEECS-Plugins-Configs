schema_version: 1
# The HTU Control Center, rebuilt from the LabVIEW GUI (GEECS-BELLA-GUIs:
# GUI_HTU_Control_Center) keeping its arrangement. Every binding is a DB device's
# bare PV (the CA gateway's readback name, geecs_core.pv_naming); their writes stay
# disabled until the module writes gateway PVs. control_center.mapping.md is the
# label-to-device evidence; a control marked "(not bound)" is a TODO there.
title: HTU Control Center
groups:
  - title: GAIA control
    at: [1, 1]
    size: [4, 1]
    tone: trace-2
    columns: 2
    widgets:
      - {kind: annotation, label: North shutters}
      - {kind: annotation, label: South shutters}
      - {kind: flipper, label: Gaia stop, bind: {pv: "undulator:u_148_plc:do_ch1"}, indicators: [{pv: "undulator:u_148_plc:di_ch1"}, {pv: "undulator:u_148_plc:di_ch2"}]}
      - {kind: flipper, label: Gaia stop, bind: {pv: "undulator:u_148_plc:do_ch2"}, indicators: [{pv: "undulator:u_148_plc:di_ch3"}, {pv: "undulator:u_148_plc:di_ch4"}]}
      # left column North, right South: the DB aliases (Gaia Amp2-4 North = DO.Ch8/7/6, South = DO.Ch3/4/5)
      - {kind: flipper, label: Amp2, bind: {pv: "undulator:u_148_plc:do_ch8"}, indicators: [{pv: "undulator:u_148_plc:di_ch15"}, {pv: "undulator:u_148_plc:di_ch16"}]}
      - {kind: flipper, label: Amp2, bind: {pv: "undulator:u_148_plc:do_ch3"}, indicators: [{pv: "undulator:u_148_plc:di_ch5"}, {pv: "undulator:u_148_plc:di_ch6"}]}
      - {kind: flipper, label: Amp3, bind: {pv: "undulator:u_148_plc:do_ch7"}, indicators: [{pv: "undulator:u_148_plc:di_ch13"}, {pv: "undulator:u_148_plc:di_ch14"}]}
      - {kind: flipper, label: Amp3, bind: {pv: "undulator:u_148_plc:do_ch4"}, indicators: [{pv: "undulator:u_148_plc:di_ch7"}, {pv: "undulator:u_148_plc:di_ch8"}]}
      - {kind: flipper, label: Amp4, bind: {pv: "undulator:u_148_plc:do_ch6"}, indicators: [{pv: "undulator:u_148_plc:di_ch11"}, {pv: "undulator:u_148_plc:di_ch12"}]}
      - {kind: flipper, label: Amp4, bind: {pv: "undulator:u_148_plc:do_ch5"}, indicators: [{pv: "undulator:u_148_plc:di_ch9"}, {pv: "undulator:u_148_plc:di_ch10"}]}
      - {kind: annotation, label: "MRC Trigger (not bound)"}
      - {kind: setpoint, label: Gaia lamp timing, bind: {pv: "undulator:u_1hzshiftedbox:delay_channel_c"}, precision: 5}
      - {kind: toggle, label: Gaia internal shutter A, bind: {pv: "undulator:u_gaiasvereader:internalshuttera"}, confirm: "Are you sure?"}
      - {kind: toggle, label: Gaia internal shutter B, bind: {pv: "undulator:u_gaiasvereader:internalshutterb"}, confirm: "Are you sure?"}
      - {kind: readout, label: Internal Shutter A, bind: {pv: "undulator:u_gaiasvereader:internalshuttera"}}
      - {kind: readout, label: Internal Shutter B, bind: {pv: "undulator:u_gaiasvereader:internalshutterb"}}
  - title: 148 TRA motors
    at: [5, 1]
    tone: trace-2
    columns: 2
    widgets:
      - {kind: setpoint, label: Tube In X, bind: {pv: "undulator:u_traserver01:position_axis_1"}, precision: 5}
      - {kind: setpoint, label: Tube In Y, bind: {pv: "undulator:u_traserver01:position_axis_2"}, precision: 5}
      - {kind: setpoint, label: Comp In X, bind: {pv: "undulator:u_traserver01:position_axis_3"}, precision: 5}
      - {kind: setpoint, label: Comp In Y, bind: {pv: "undulator:u_traserver01:position_axis_4"}, precision: 5}
      - {kind: setpoint, label: DM Surf. X, bind: {pv: "undulator:u_traserver03:position_axis_5"}, precision: 5}
      - {kind: setpoint, label: DM Surf. Y, bind: {pv: "undulator:u_traserver03:position_axis_6"}, precision: 5}
      - {kind: setpoint, label: BCave In X, bind: {pv: "undulator:u_traserver03:position_axis_1"}, precision: 5}
      - {kind: setpoint, label: BCave In Y, bind: {pv: "undulator:u_traserver03:position_axis_2"}, precision: 5}
      - {kind: setpoint, label: OAP1 In X, bind: {pv: "undulator:u_traserver03:position_axis_3"}, precision: 5}
      - {kind: setpoint, label: OAP1 In Y, bind: {pv: "undulator:u_traserver03:position_axis_4"}, precision: 5}
  - title: Extra Flippers
    at: [6, 1]
    tone: trace-2
    columns: 2
    widgets:
      - {kind: flipper, label: Amp4 dump, bind: {pv: "undulator:u_148_plc:do_ch9"}, indicators: [{pv: "undulator:u_148_plc:di_ch17"}, {pv: "undulator:u_148_plc:di_ch18"}]}
      - {kind: flipper, label: Iris, bind: {pv: "undulator:u_148_plc:do_ch12"}, indicators: [{pv: "undulator:u_148_plc:di_ch23"}, {pv: "undulator:u_148_plc:di_ch24"}]}
  - title: Filters
    at: [7, 1]
    tone: trace-4
    columns: 5
    widgets:
      - {kind: annotation, label: "Grating Cam (not bound)"}
      - {kind: toggle, label: OAPin2, bind: {pv: "undulator:u_plc:do_ch1"}}
      - {kind: setpoint, label: Ghost pulsed, bind: {pv: "undulator:u_ghostfilters:pos_channel0"}}
      - {kind: setpoint, label: Probe, bind: {pv: "undulator:u_probefilters:pos_channel0"}}
      - {kind: setpoint, label: HASO, bind: {pv: "undulator:u_haso_filters:pos_channel0"}}
  - title: B-Cave Alignment
    at: [1, 2]
    tone: trace-1
    columns: 3
    widgets:
      - {kind: setpoint, label: OAP In 2 X, bind: {pv: "undulator:u_esp302_01:position_axis_1"}}
      - {kind: setpoint, label: OAP In 2 Y, bind: {pv: "undulator:u_esp302_01:position_axis_2"}}
      - {kind: setpoint, label: TC In Stage, bind: {pv: "undulator:u_tcalignstages:position_ch2"}}
      - {kind: setpoint, label: Beamline In X, bind: {pv: "undulator:u_esp302_02:position_axis_2"}}
      - {kind: setpoint, label: Beamline In Y, bind: {pv: "undulator:u_esp302_02:position_axis_3"}}
      - {kind: setpoint, label: TC Out Stage, bind: {pv: "undulator:u_tcalignstages:position_ch1"}}
      - {kind: setpoint, label: Beamline Out X, bind: {pv: "undulator:u_esp302_01:position_axis_3"}}
      - {kind: setpoint, label: Beamline Out Y, bind: {pv: "undulator:u_esp302_02:position_axis_1"}}
  - title: Mode Imager
    at: [2, 2]
    tone: muted
    columns: 3
    widgets:
      - {kind: setpoint, label: Coarse Filters, bind: {pv: "undulator:u_mi_coarsefilters:pos_channel0"}}
      - {kind: setpoint, label: Fine Filters, bind: {pv: "undulator:u_mi_finefilters:pos_channel0"}}
      - {kind: setpoint, label: Position, bind: {pv: "undulator:u_modeimageresp:position_axis_1"}}
  - title: Compressor
    at: [3, 2]
    tone: accent
    columns: 4
    widgets:
      - {kind: setpoint, label: Separation, bind: {pv: "undulator:u_compaerotech:position_axis1"}, precision: 1}
      - {kind: readout, label: Angle 1, bind: {pv: "undulator:u_compaerotech:position_axis2"}, precision: 3}
      - {kind: readout, label: Angle 2, bind: {pv: "undulator:u_compaerotech:position_axis3"}, precision: 3}
      - {kind: image, label: Compressor, src: compressor.png}
  - title: Hexapod
    at: [4, 2]
    size: [2, 1]
    tone: accent
    columns: 2
    widgets:
      - {kind: setpoint, label: x, bind: {pv: "undulator:u_hexapod:xpos"}, precision: 5}
      - {kind: setpoint, label: u, bind: {pv: "undulator:u_hexapod:uangle"}, precision: 5}
      - {kind: setpoint, label: y, bind: {pv: "undulator:u_hexapod:ypos"}, precision: 5}
      - {kind: setpoint, label: v, bind: {pv: "undulator:u_hexapod:vangle"}, precision: 5}
      - {kind: setpoint, label: z, bind: {pv: "undulator:u_hexapod:zpos"}, precision: 5}
      - {kind: setpoint, label: w, bind: {pv: "undulator:u_hexapod:wangle"}, precision: 5}
      - {kind: annotation, label: "\"+x\" is laser propagation direction\n\"+y\" is toward parking lot\n\"+z\" is up\nPMQ out at y=-22.0, in at ~17.5"}
      - {kind: image, label: Hexapod, src: hexapod.png}
  - title: Valve Control
    at: [6, 2]
    size: [2, 1]
    tone: trace-4
    columns: 7
    widgets:
      - {kind: toggle, label: Beam Dump, bind: {pv: "undulator:u_plc:do_ch5"}, confirm: Shutter the laser before switching.}
      - {kind: toggle, label: TC phos, bind: {pv: "undulator:u_plc:do_ch11"}, confirm: Shutter the laser before switching.}
      - {kind: toggle, label: Slit, bind: {pv: "undulator:u_plc:do_ch2"}, confirm: Shutter the laser before switching.}
      - {kind: toggle, label: MI Wedge, bind: {pv: "undulator:u_plc:do_ch3"}, confirm: Shutter the laser before switching.}
      - {kind: toggle, label: DC Phos, bind: {pv: "undulator:u_plc:do_ch7"}}
      - {kind: toggle, label: CTR, bind: {pv: "undulator:u_plc:do_ch10"}}
      - {kind: toggle, label: Phos1, bind: {pv: "undulator:u_plc:do_ch4"}}
      - {kind: toggle, label: Aline1, bind: {pv: "undulator:u_plc:do_ch18"}}
      # the DB aliases U_PLC DO.Ch9 "ALine2", not emit spoiler: check the hardware before its write is enabled
      - {kind: readout, label: emit spoiler, bind: {pv: "undulator:u_plc:do_ch9"}}
      - {kind: readout, label: Aline 3, bind: {pv: "undulator:u_plc:do_ch8"}}
      - {kind: toggle, label: Visa1, bind: {pv: "undulator:u_visaplungers:digitaloutput_channel_7"}}
      - {kind: toggle, label: Visa2, bind: {pv: "undulator:u_visaplungers:digitaloutput_channel_6"}}
      - {kind: toggle, label: Visa3, bind: {pv: "undulator:u_visaplungers:digitaloutput_channel_5"}}
      - {kind: toggle, label: Visa4, bind: {pv: "undulator:u_visaplungers:digitaloutput_channel_4"}}
      - {kind: toggle, label: Visa5, bind: {pv: "undulator:u_visaplungers:digitaloutput_channel_3"}}
      - {kind: toggle, label: Visa6, bind: {pv: "undulator:u_visaplungers:digitaloutput_channel_2"}}
      - {kind: toggle, label: Visa7, bind: {pv: "undulator:u_visaplungers:digitaloutput_channel_1"}}
      - {kind: toggle, label: Visa8, bind: {pv: "undulator:u_visaplungers:digitaloutput_channel_0"}}
      - {kind: toggle, label: Visa9, bind: {pv: "undulator:u_plc:do_ch19"}}
      - {kind: toggle, label: XUV valve, bind: {pv: "undulator:u_plc:do_ch20"}}
      - {kind: toggle, label: UV spec mirror, bind: {pv: "undulator:u_plc:do_ch21"}}
      - {kind: toggle, label: Emitspoiler, bind: {pv: "undulator:u_plc:do_ch9"}, confirm: "Are you sure? Have you verified Aline3 is out?"}
      - {kind: toggle, label: Aline3, bind: {pv: "undulator:u_plc:do_ch8"}, confirm: "Are you sure? Have you verified emit spoiler is out?"}
  - title: Jet Stages
    at: [1, 3]
    tone: trace-3
    columns: 3
    widgets:
      - {kind: setpoint, label: Jet_X, bind: {pv: "undulator:u_esp_jetxyz:position_axis_1"}}
      - {kind: setpoint, label: Jet_Y, bind: {pv: "undulator:u_esp_jetxyz:position_axis_2"}}
      - {kind: setpoint, label: Jet_Z, bind: {pv: "undulator:u_esp_jetxyz:position_axis_3"}}
      - {kind: setpoint, label: Jet Blade, bind: {pv: "undulator:u_modeimageresp:position_axis_2"}}
      - {kind: annotation, label: "Blade Height (not bound)"}
      - {kind: annotation, label: "\"+x\" moves toward parking lot\n\"+y\" moves down\n\"+z\" moves upstream\n\"+\" moves jet blade out of jet\n\"+\" blade height moves away from jet"}
  - title: Jet timing
    at: [2, 3]
    size: [3, 1]
    tone: slate
    columns: 2
    widgets:
      - {kind: setpoint, label: "Pressure Control Voltage (V)", bind: {pv: "undulator:u_hp_daq:analogoutput_channel_1"}}
      - {kind: setpoint, label: "Set opening time (s)", bind: {pv: "undulator:u_dg645_shotcontrol:delay_ch_b"}}
      - {kind: annotation, label: "Jet Trigger (not bound)"}
      - {kind: readout, label: Amplitude Jet trigger, bind: {pv: "undulator:u_dg645_shotcontrol:amplitude_ch_ab"}}
      - {kind: annotation, label: "Jet Enable (not bound)"}
      - {kind: readout, label: "Opening time (s)", bind: {pv: "undulator:u_dg645_shotcontrol:delay_ch_b"}}
      - {kind: toggle, label: Purge, bind: {pv: "undulator:u_plc:do_ch6"}}
      - {kind: toggle, label: auto purge, bind: {pv: "undulator:u_plc:softwarevars_ch1"}}
  - title: Misc area
    at: [5, 3]
    tone: slate
    columns: 2
    widgets:
      - {kind: setpoint, label: Probe delay, bind: {pv: "undulator:u_modeimageresp:position_axis_3"}}
      - {kind: setpoint, label: Phasics focus, bind: {pv: "undulator:u_zaber:position_ch1"}}
      - {kind: setpoint, label: Ghost focus, bind: {pv: "undulator:u_zaber:position_ch2"}}
      - {kind: setpoint, label: Ghost filter, bind: {pv: "undulator:u_zaber:position_ch3"}}
      - {kind: setpoint, label: Probe cam Stage, bind: {pv: "undulator:u_probecamstage:position"}}
      - {kind: setpoint, label: Probe cam offset, bind: {pv: "undulator:u_probecamstage:offset"}}
      - {kind: annotation, label: "\"in\" at position 0.0\n\"out\" at position 75.0"}
  - title: Vacuum
    at: [6, 3]
    tone: slate
    columns: 2
    widgets:
      - {kind: readout, label: BCavePressure, bind: {pv: "undulator:u_vacuumgauge:ai_mean_channel_0"}, units: V}
      - {kind: readout, label: ACavePressure, bind: {pv: "undulator:u_vacuumgauge:ai_mean_channel_1"}, units: V}
  - title: Mag Specs
    at: [7, 3]
    tone: slate
    columns: 2
    widgets:
      - {kind: setpoint, label: BCave Current, bind: {pv: "undulator:u_bcavemagspecps:current_limit_ch1"}}
      # U_ACaveMagSpecPS is disabled in the experiment: the gateway serves it once it is re-enabled
      - {kind: setpoint, label: ACave Current, bind: {pv: "undulator:u_acavemagspecps:current"}}
      - {kind: readout, label: BCave Hall probe, bind: {pv: "undulator:u_bcavehallprobe:rawfield"}}
      - {kind: readout, label: ACave Hall probe, bind: {pv: "undulator:u_acavehallprobe:rawfield"}}
      - {kind: setpoint, label: BCave Trim Current, bind: {pv: "undulator:u_emqtripletbipolar:current_limit_ch4"}}
