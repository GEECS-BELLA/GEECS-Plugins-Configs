schema_version: 1
# The HTU Control Center, rebuilt from the LabVIEW GUI (GEECS-BELLA-GUIs:
# GUI_HTU_Control_Center) keeping its arrangement. Every write binds a DB device and
# its GEECS variable ({device, role}), written through the device module's gated put;
# control_center_bindings.py regenerates those bindings from the mapping (run it after
# editing a writing row). Readouts and lamps bind the CA gateway's bare readback PV
# (geecs_core.pv_naming; read only). control_center.mapping.md is the
# label-to-device evidence; a control marked "(not bound)" is a TODO there.
title: HTU Control Center
groups:
  - title: GAIA control
    at: [1, 1]
    size: [4, 1]
    tone: trace-2
    columns: 2
    widgets:
      - {kind: annotation, label: North shutters}
      - {kind: annotation, label: South shutters}
      - {kind: flipper, label: Gaia stop, bind: {device: U_148_PLC, role: "DO.Ch1"}, indicators: [{pv: "undulator:u_148_plc:di_ch1"}, {pv: "undulator:u_148_plc:di_ch2"}]}
      - {kind: flipper, label: Gaia stop, bind: {device: U_148_PLC, role: "DO.Ch2"}, indicators: [{pv: "undulator:u_148_plc:di_ch3"}, {pv: "undulator:u_148_plc:di_ch4"}]}
      # left column North, right South: the DB aliases (Gaia Amp2-4 North = DO.Ch8/7/6, South = DO.Ch3/4/5)
      - {kind: flipper, label: Amp2, bind: {device: U_148_PLC, role: "DO.Ch8"}, indicators: [{pv: "undulator:u_148_plc:di_ch15"}, {pv: "undulator:u_148_plc:di_ch16"}]}
      - {kind: flipper, label: Amp2, bind: {device: U_148_PLC, role: "DO.Ch3"}, indicators: [{pv: "undulator:u_148_plc:di_ch5"}, {pv: "undulator:u_148_plc:di_ch6"}]}
      - {kind: flipper, label: Amp3, bind: {device: U_148_PLC, role: "DO.Ch7"}, indicators: [{pv: "undulator:u_148_plc:di_ch13"}, {pv: "undulator:u_148_plc:di_ch14"}]}
      - {kind: flipper, label: Amp3, bind: {device: U_148_PLC, role: "DO.Ch4"}, indicators: [{pv: "undulator:u_148_plc:di_ch7"}, {pv: "undulator:u_148_plc:di_ch8"}]}
      - {kind: flipper, label: Amp4, bind: {device: U_148_PLC, role: "DO.Ch6"}, indicators: [{pv: "undulator:u_148_plc:di_ch11"}, {pv: "undulator:u_148_plc:di_ch12"}]}
      - {kind: flipper, label: Amp4, bind: {device: U_148_PLC, role: "DO.Ch5"}, indicators: [{pv: "undulator:u_148_plc:di_ch9"}, {pv: "undulator:u_148_plc:di_ch10"}]}
      - {kind: annotation, label: "MRC Trigger (not bound)"}
      - {kind: setpoint, label: Gaia lamp timing, bind: {device: U_1HzShiftedBox, role: "delay.Channel_C"}, precision: 5}
      - {kind: toggle, label: Gaia internal shutter A, bind: {device: U_GaiaSVEReader, role: "InternalShutterA"}, confirm: "Are you sure?"}
      - {kind: toggle, label: Gaia internal shutter B, bind: {device: U_GaiaSVEReader, role: "InternalShutterB"}, confirm: "Are you sure?"}
      - {kind: readout, label: Internal Shutter A, bind: {pv: "undulator:u_gaiasvereader:internalshuttera"}}
      - {kind: readout, label: Internal Shutter B, bind: {pv: "undulator:u_gaiasvereader:internalshutterb"}}
  - title: 148 TRA motors
    at: [5, 1]
    tone: trace-2
    columns: 2
    widgets:
      - {kind: setpoint, label: Tube In X, bind: {device: U_TRAServer01, role: "Position.Axis 1"}, precision: 5}
      - {kind: setpoint, label: Tube In Y, bind: {device: U_TRAServer01, role: "Position.Axis 2"}, precision: 5}
      - {kind: setpoint, label: Comp In X, bind: {device: U_TRAServer01, role: "Position.Axis 3"}, precision: 5}
      - {kind: setpoint, label: Comp In Y, bind: {device: U_TRAServer01, role: "Position.Axis 4"}, precision: 5}
      - {kind: setpoint, label: DM Surf. X, bind: {device: U_TRAServer03, role: "Position.Axis 5"}, precision: 5}
      - {kind: setpoint, label: DM Surf. Y, bind: {device: U_TRAServer03, role: "Position.Axis 6"}, precision: 5}
      - {kind: setpoint, label: BCave In X, bind: {device: U_TRAServer03, role: "Position.Axis 1"}, precision: 5}
      - {kind: setpoint, label: BCave In Y, bind: {device: U_TRAServer03, role: "Position.Axis 2"}, precision: 5}
      - {kind: setpoint, label: OAP1 In X, bind: {device: U_TRAServer03, role: "Position.Axis 3"}, precision: 5}
      - {kind: setpoint, label: OAP1 In Y, bind: {device: U_TRAServer03, role: "Position.Axis 4"}, precision: 5}
  - title: Extra Flippers
    at: [6, 1]
    tone: trace-2
    columns: 2
    widgets:
      - {kind: flipper, label: Amp4 dump, bind: {device: U_148_PLC, role: "DO.Ch9"}, indicators: [{pv: "undulator:u_148_plc:di_ch17"}, {pv: "undulator:u_148_plc:di_ch18"}]}
      - {kind: flipper, label: Iris, bind: {device: U_148_PLC, role: "DO.Ch12"}, indicators: [{pv: "undulator:u_148_plc:di_ch23"}, {pv: "undulator:u_148_plc:di_ch24"}]}
  - title: Filters
    at: [7, 1]
    tone: trace-4
    columns: 5
    widgets:
      - {kind: annotation, label: "Grating Cam (not bound)"}
      - {kind: toggle, label: OAPin2, bind: {device: U_PLC, role: "DO.Ch1"}}
      - {kind: setpoint, label: Ghost pulsed, bind: {device: U_GhostFilters, role: "pos.Channel0"}}
      - {kind: setpoint, label: Probe, bind: {device: U_ProbeFilters, role: "pos.Channel0"}}
      - {kind: setpoint, label: HASO, bind: {device: U_HASO_Filters, role: "pos.Channel0"}}
  - title: B-Cave Alignment
    at: [1, 2]
    tone: trace-1
    columns: 3
    widgets:
      - {kind: setpoint, label: OAP In 2 X, bind: {device: U_ESP302_01, role: "Position.Axis 1"}}
      - {kind: setpoint, label: OAP In 2 Y, bind: {device: U_ESP302_01, role: "Position.Axis 2"}}
      - {kind: setpoint, label: TC In Stage, bind: {device: U_TCAlignStages, role: "Position.Ch2"}}
      - {kind: setpoint, label: Beamline In X, bind: {device: U_ESP302_02, role: "Position.Axis 2"}}
      - {kind: setpoint, label: Beamline In Y, bind: {device: U_ESP302_02, role: "Position.Axis 3"}}
      - {kind: setpoint, label: TC Out Stage, bind: {device: U_TCAlignStages, role: "Position.Ch1"}}
      - {kind: setpoint, label: Beamline Out X, bind: {device: U_ESP302_01, role: "Position.Axis 3"}}
      - {kind: setpoint, label: Beamline Out Y, bind: {device: U_ESP302_02, role: "Position.Axis 1"}}
  - title: Mode Imager
    at: [2, 2]
    tone: muted
    columns: 3
    widgets:
      - {kind: setpoint, label: Coarse Filters, bind: {device: U_MI_CoarseFilters, role: "pos.Channel0"}}
      - {kind: setpoint, label: Fine Filters, bind: {device: U_MI_FineFilters, role: "pos.Channel0"}}
      - {kind: setpoint, label: Position, bind: {device: U_ModeImagerESP, role: "Position.Axis 1"}}
  - title: Compressor
    at: [3, 2]
    tone: accent
    columns: 4
    widgets:
      - {kind: setpoint, label: Separation, bind: {device: U_CompAerotech, role: "Position.Axis1"}, precision: 1}
      - {kind: readout, label: Angle 1, bind: {pv: "undulator:u_compaerotech:position_axis2"}, precision: 3}
      - {kind: readout, label: Angle 2, bind: {pv: "undulator:u_compaerotech:position_axis3"}, precision: 3}
      - {kind: image, label: Compressor, src: compressor.png}
  - title: Hexapod
    at: [4, 2]
    size: [2, 1]
    tone: accent
    columns: 2
    widgets:
      - {kind: setpoint, label: x, bind: {device: U_Hexapod, role: "xpos"}, precision: 5}
      - {kind: setpoint, label: u, bind: {device: U_Hexapod, role: "uangle"}, precision: 5}
      - {kind: setpoint, label: y, bind: {device: U_Hexapod, role: "ypos"}, precision: 5}
      - {kind: setpoint, label: v, bind: {device: U_Hexapod, role: "vangle"}, precision: 5}
      - {kind: setpoint, label: z, bind: {device: U_Hexapod, role: "zpos"}, precision: 5}
      - {kind: setpoint, label: w, bind: {device: U_Hexapod, role: "wangle"}, precision: 5}
      - {kind: annotation, label: "\"+x\" is laser propagation direction\n\"+y\" is toward parking lot\n\"+z\" is up\nPMQ out at y=-22.0, in at ~17.5"}
      - {kind: image, label: Hexapod, src: hexapod.png}
  - title: Valve Control
    at: [6, 2]
    size: [2, 1]
    tone: trace-4
    columns: 7
    widgets:
      - {kind: toggle, label: Beam Dump, bind: {device: U_PLC, role: "DO.Ch5"}, confirm: Shutter the laser before switching.}
      - {kind: toggle, label: TC phos, bind: {device: U_PLC, role: "DO.Ch11"}, confirm: Shutter the laser before switching.}
      - {kind: toggle, label: Slit, bind: {device: U_PLC, role: "DO.Ch2"}, confirm: Shutter the laser before switching.}
      - {kind: toggle, label: MI Wedge, bind: {device: U_PLC, role: "DO.Ch3"}, confirm: Shutter the laser before switching.}
      - {kind: toggle, label: DC Phos, bind: {device: U_PLC, role: "DO.Ch7"}}
      - {kind: toggle, label: CTR, bind: {device: U_PLC, role: "DO.Ch10"}}
      - {kind: toggle, label: Phos1, bind: {device: U_PLC, role: "DO.Ch4"}}
      - {kind: toggle, label: Aline1, bind: {device: U_PLC, role: "DO.Ch18"}}
      # the DB aliases U_PLC DO.Ch9 "ALine2", not emit spoiler: check the hardware before its write is enabled
      - {kind: readout, label: emit spoiler, bind: {pv: "undulator:u_plc:do_ch9"}}
      - {kind: readout, label: Aline 3, bind: {pv: "undulator:u_plc:do_ch8"}}
      - {kind: toggle, label: Visa1, bind: {device: U_VisaPlungers, role: "DigitalOutput.Channel 7"}}
      - {kind: toggle, label: Visa2, bind: {device: U_VisaPlungers, role: "DigitalOutput.Channel 6"}}
      - {kind: toggle, label: Visa3, bind: {device: U_VisaPlungers, role: "DigitalOutput.Channel 5"}}
      - {kind: toggle, label: Visa4, bind: {device: U_VisaPlungers, role: "DigitalOutput.Channel 4"}}
      - {kind: toggle, label: Visa5, bind: {device: U_VisaPlungers, role: "DigitalOutput.Channel 3"}}
      - {kind: toggle, label: Visa6, bind: {device: U_VisaPlungers, role: "DigitalOutput.Channel 2"}}
      - {kind: toggle, label: Visa7, bind: {device: U_VisaPlungers, role: "DigitalOutput.Channel 1"}}
      - {kind: toggle, label: Visa8, bind: {device: U_VisaPlungers, role: "DigitalOutput.Channel 0"}}
      - {kind: toggle, label: Visa9, bind: {device: U_PLC, role: "DO.Ch19"}}
      - {kind: toggle, label: XUV valve, bind: {device: U_PLC, role: "DO.Ch20"}}
      - {kind: toggle, label: UV spec mirror, bind: {device: U_PLC, role: "DO.Ch21"}}
      - {kind: toggle, label: Emitspoiler, bind: {device: U_PLC, role: "DO.Ch9"}, confirm: "Are you sure? Have you verified Aline3 is out?"}
      - {kind: toggle, label: Aline3, bind: {device: U_PLC, role: "DO.Ch8"}, confirm: "Are you sure? Have you verified emit spoiler is out?"}
  - title: Jet Stages
    at: [1, 3]
    tone: trace-3
    columns: 3
    widgets:
      - {kind: setpoint, label: Jet_X, bind: {device: U_ESP_JetXYZ, role: "Position.Axis 1"}}
      - {kind: setpoint, label: Jet_Y, bind: {device: U_ESP_JetXYZ, role: "Position.Axis 2"}}
      - {kind: setpoint, label: Jet_Z, bind: {device: U_ESP_JetXYZ, role: "Position.Axis 3"}}
      - {kind: setpoint, label: Jet Blade, bind: {device: U_ModeImagerESP, role: "Position.Axis 2"}}
      - {kind: annotation, label: "Blade Height (not bound)"}
      - {kind: annotation, label: "\"+x\" moves toward parking lot\n\"+y\" moves down\n\"+z\" moves upstream\n\"+\" moves jet blade out of jet\n\"+\" blade height moves away from jet"}
  - title: Jet timing
    at: [2, 3]
    size: [3, 1]
    tone: slate
    columns: 2
    widgets:
      - {kind: setpoint, label: "Pressure Control Voltage (V)", bind: {device: U_HP_Daq, role: "AnalogOutput.Channel 1"}}
      - {kind: setpoint, label: "Set opening time (s)", bind: {device: U_DG645_ShotControl, role: "Delay.Ch B"}}
      - {kind: annotation, label: "Jet Trigger (not bound)"}
      - {kind: readout, label: Amplitude Jet trigger, bind: {pv: "undulator:u_dg645_shotcontrol:amplitude_ch_ab"}}
      - {kind: annotation, label: "Jet Enable (not bound)"}
      - {kind: readout, label: "Opening time (s)", bind: {pv: "undulator:u_dg645_shotcontrol:delay_ch_b"}}
      - {kind: toggle, label: Purge, bind: {device: U_PLC, role: "DO.Ch6"}}
      - {kind: toggle, label: auto purge, bind: {device: U_PLC, role: "SoftwareVars.Ch1"}}
  - title: Misc area
    at: [5, 3]
    tone: slate
    columns: 2
    widgets:
      - {kind: setpoint, label: Probe delay, bind: {device: U_ModeImagerESP, role: "Position.Axis 3"}}
      - {kind: setpoint, label: Phasics focus, bind: {device: U_Zaber, role: "Position.Ch1"}}
      - {kind: setpoint, label: Ghost focus, bind: {device: U_Zaber, role: "Position.Ch2"}}
      - {kind: setpoint, label: Ghost filter, bind: {device: U_Zaber, role: "Position.Ch3"}}
      - {kind: setpoint, label: Probe cam Stage, bind: {device: U_ProbeCamStage, role: "Position"}}
      - {kind: setpoint, label: Probe cam offset, bind: {device: U_ProbeCamStage, role: "Offset"}}
      - {kind: annotation, label: "\"in\" at position 0.0\n\"out\" at position 75.0"}
  - title: Vacuum
    at: [6, 3]
    tone: slate
    columns: 2
    widgets:
      - {kind: readout, label: BCavePressure, bind: {pv: "undulator:u_vacuumgauge:ai_mean_channel_0"}, units: V}
      - {kind: readout, label: ACavePressure, bind: {pv: "undulator:u_vacuumgauge:ai_mean_channel_1"}, units: V}
  - title: Mag Specs
    at: [7, 3]
    tone: slate
    columns: 2
    widgets:
      - {kind: setpoint, label: BCave Current, bind: {device: U_BCaveMagSpecPS, role: "Current_Limit.Ch1"}}
      # U_ACaveMagSpecPS is disabled in the experiment: the gateway serves it once it is re-enabled
      - {kind: setpoint, label: ACave Current, bind: {pv: "undulator:u_acavemagspecps:current"}}
      - {kind: readout, label: BCave Hall probe, bind: {pv: "undulator:u_bcavehallprobe:rawfield"}}
      - {kind: readout, label: ACave Hall probe, bind: {pv: "undulator:u_acavehallprobe:rawfield"}}
      - {kind: setpoint, label: BCave Trim Current, bind: {device: U_EMQTripletBipolar, role: "Current_Limit.Ch4"}}
