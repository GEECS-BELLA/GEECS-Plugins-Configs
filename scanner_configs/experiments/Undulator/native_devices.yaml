    trigger_source: line0
  UC_VisaEBeam4:
    kind: aravis_camera
    trigger_source: line0
  # The VISA steering supplies (CAEN Easy-Driver, family easydriver): each
  # set confirmed on the current readback within 5 mA.
  U_VS1H:
    kind: setpoint_device
    settables:
      current: {tolerance: 0.005, timeout: 10}
    readbacks: [voltage]
    status: [fault, interlock]
