schema_version: 1
name: Bella_standard_save
description: >-
  Every device enabled in Bella that has a save variable in the GEECS DB
  (expt_device_variable, read 2026-11-18), the trigger box DDG-AA-ShotCntrl
  excepted. Only CAM-2BL-F3M7 is required; the rest record every shot they
  catch without holding one. A device disabled in the experiment since must
  be removed from the table after loading (the worker refuses a run naming a
  device it does not serve). Load it, then pick Count / Sweep and edit the
  plan on the page.
trigger_profile: Bella-Normal
background: false
native_image_save: null
background_telemetry: null
