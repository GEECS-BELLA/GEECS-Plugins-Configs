schema_version: 2
name: Bella-Normal
description: >-
  Bella normal operation on DDG-AA-ShotCntrl, modelled on Undulator's
  HTU-Normal. Output GH (the camera trigger) is gated by its amplitude:
  5 V while armed or scanning, 0.5 V (below the camera's threshold) otherwise.
  These match the device's own scan-boundary rows in the GEECS DB
  (expt_device_variable), which it applies only in GEECS scan mode;
  this profile runs strict mode, so it writes them itself.
states:
  'OFF':
    - {device: DDG-AA-ShotCntrl, variable: Trigger.Source, value: Single shot external rising edges}
    - {device: DDG-AA-ShotCntrl, variable: Amplitude.Ch GH, value: '0.5'}
  STANDBY:
    - {device: DDG-AA-ShotCntrl, variable: Trigger.Source, value: External rising edges}
    - {device: DDG-AA-ShotCntrl, variable: Amplitude.Ch GH, value: '0.5'}
  SCAN:
    - {device: DDG-AA-ShotCntrl, variable: Trigger.Source, value: External rising edges}
    - {device: DDG-AA-ShotCntrl, variable: Amplitude.Ch GH, value: '5'}
  ARMED:
    - {device: DDG-AA-ShotCntrl, variable: Trigger.Source, value: Single shot external rising edges}
    - {device: DDG-AA-ShotCntrl, variable: Amplitude.Ch GH, value: '5'}
  SINGLESHOT:
    - {device: DDG-AA-ShotCntrl, variable: Trigger.ExecuteSingleShot, value: 'on'}
